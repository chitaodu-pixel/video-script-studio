[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-script-studio"
version = "0.1.0"
description = "Offline-first Windows video transcription, rewriting and TTS desktop tool"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "faster-whisper>=1.1,<2",
  "pyttsx3>=2.98,<3",
  "tkinterdnd2>=0.6,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
video-script-studio = "video_script_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
